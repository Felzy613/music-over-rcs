# Backs up the three SQLite databases to Cloudflare R2 and brings them back on the next start (see docs/cloud.md).
# The settings come from the environment (R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and R2_REGION, which
# the host sets to auto unless told otherwise).
#
# Every byte sent to R2 counts toward Render's 5 GB of outbound traffic a month (the service was suspended for going over
# it on 2026-10-29), so the changes go up in few, large pieces:
# - monitor-interval is how often Litestream reads what changed into a file to upload (by default every second). A page the
#   homeserver rewrites a hundred times in five minutes goes up once, not a hundred times. The price is that a host killed
#   outright (not stopped: a stop uploads what is left) loses up to five minutes of changes.
# - sync-interval is how often those files are sent; every 60 s, so one is never kept waiting long. Sending it more often
#   would use up R2's free million writes a month, since the homeserver writes all day.
# - One merge level, hourly, where the default has three (30 s, 5 min, 1 h), each of which uploads the same changes again:
#   about 75 MB of backups in a busy hour on 2026-10-28, for about 2.5 MB of pages that had actually changed.
levels:
  - interval: 1h

snapshot:
  interval: 24h
  retention: 72h

dbs:
  - path: /data/synapse/homeserver.db
    monitor-interval: 5m
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: synapse
      endpoint: ${R2_ENDPOINT}
      region: ${R2_REGION}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      sync-interval: 60s
  - path: /data/gmessages/mautrix-gmessages.db
    monitor-interval: 5m
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: gmessages
      endpoint: ${R2_ENDPOINT}
      region: ${R2_REGION}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      sync-interval: 60s
  - path: /data/catalog.db
    monitor-interval: 5m
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: catalog
      endpoint: ${R2_ENDPOINT}
      region: ${R2_REGION}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      sync-interval: 60s
